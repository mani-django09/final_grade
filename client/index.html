    <!-- Structured Data – FAQPage (static, crawlable without JS) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Where's the final exam weight listed in my syllabus?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Check the first few pages of your syllabus under Grading Policy or Course Assessment. Your instructor lists the percentage each component counts toward your grade. If not there, check Canvas or Blackboard — or email your professor."
          }
        },
        {
          "@type": "Question",
          "name": "What if the calculator tells me I need 110%?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "That means hitting your goal with just the final exam is not possible. Check if your professor offers extra credit, or consider adjusting your target grade. Dropping your goal by 3-5 points often makes it achievable."
          }
        },
        {
          "@type": "Question",
          "name": "My class gets curved. How does that affect this?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A curve almost always helps you, so treat our number as the worst-case scenario. If your professor curves individual exams or final grades, the actual score you need is likely lower than what we show."
          }
        },
        {
          "@type": "Question",
          "name": "Can I convert letter grades to percentages?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — check your syllabus for the conversion scale. Most schools use A = 93–96%, B+ = 87–89%, B = 83–86%, etc. Use the midpoint of the range for best accuracy."
          }
        },
        {
          "@type": "Question",
          "name": "How accurate is the final grade calculator?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The calculator uses the exact weighted average formula that professors use: Required Score = (Desired Grade - Current Grade x (1 - Final Weight)) / Final Weight. It is 100% mathematically accurate."
          }
        }
      ]
    }
    </script>
